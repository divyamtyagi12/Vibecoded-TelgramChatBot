[project]
name = "telegram-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5.0,<7",
  "pillow>=10.0,<13",
  "primp>=0.15,<3",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=22,<23",
  "telethon>=1.36,<2",
]

[tool.vercel]
entrypoint = "api.telegram:app"
